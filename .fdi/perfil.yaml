# Perfil del repositorio (ADR 0028): overrides sobre el perfil-base del stack.
# Propuesto por el inventario de la FDI; lo ancla devops (D4_perfil).
version: 1
stack: java-spring-maven
hereda: true
cuarentena:
  patrones:
  - org/springframework/samples/petclinic/api/ApiGatewayApplicationTests.java
  - org/springframework/samples/petclinic/config/PetclinicConfigServerApplicationTests.java
  - org/springframework/samples/petclinic/discovery/DiscoveryServerApplicationTests.java
  vence: '2026-11-22'
  razon: pruebas que tocan datasource/red del cliente (detectadas por el inventario)

# --- FASE 1 del banco comparativo (temporal, 2026-08-29) --------------------------------------
# Deja el muro con las DOS compuertas que decidió el experimento: pruebas y cobertura. Las listas
# REEMPLAZAN al heredar (`domain/perfil.efectivo`), asi que esto sustituye la lista completa del
# blueprint — sast, sbom, secretos y duplicacion NO corren en esta fase.
#
# Por que: el costo de una HU se reparte entre razonar y verificar, y mezclados no se puede
# atribuir ninguna mejora. Con solo estas dos, un pase del muro baja de ~8 min a ~90 s y lo que
# quede de diferencia contra la referencia humana es razonamiento, no infraestructura.
#
# Las compuertas van copiadas VERBATIM del blueprint del stack: el experimento cambia CUALES
# corren, jamas COMO corren — si el argv difiere, deja de medir lo mismo.
#
# TEMPORAL: las fases siguientes reponen compuertas hasta volver a la lista completa, momento en
# el que este bloque desaparece y el repo vuelve a heredar del blueprint sin override.
compuertas:
- nombre: pruebas
  argv: [mvn, -B, -o, -s, /run/fdi/credenciales/settings.xml, -Dmaven.repo.local=.fdi/m2,
         # La cache es COMPARTIDA entre corridas del repo, asi que dos lotes del mismo
         # repo pueden escribirla a la vez: el repositorio local de Maven no es seguro
         # para eso por defecto y se corrompe. Con file-lock, se serializan.
         -Daether.syncContext.named.factory=file-lock,
         # El nameMapper NO es opcional con file-lock: sin el, Maven aborta con
         # «FileLockNamedLockFactory lock factory requires FS friendly NameMapper»
         # (error INTERNO, no una compuerta roja). `file-gav` es el mapeo por artefacto.
         -Daether.syncContext.named.nameMapper=file-gav,
         "-Dsurefire.excludesFile=${maven.multiModuleProjectDirectory}/.fdi/cuarentena.txt",
         "--projects={modulo}", "-Dtest={prueba}", -DfailIfNoSpecifiedTests=false,
         "org.jacoco:jacoco-maven-plugin:0.8.12:prepare-agent", test,
         "org.jacoco:jacoco-maven-plugin:0.8.12:report"]
  reporte: {formato: junit, rutas: ["**/target/surefire-reports/TEST-*.xml"]}
  timeout_s: 1800
- nombre: cobertura
  argv: []
  reporte: {formato: jacoco, rutas: ["**/target/site/jacoco/jacoco.xml"]}

# Repo de ENSAYO de la Fabrica: la rama de trabajo la posee ella y su contenido se regenera en
# cada corrida, asi que puede reemplazar su propio snapshot. Sin esto, una corrida que escala deja
# su commit de evidencia y la SIGUIENTE —aunque llegue a verde— no puede publicarse: el push se
# rechaza por non-fast-forward. Medido en dev con RUN-19 → RUN-20.
# En un repo de CLIENTE esto NO va encendido: reescribir su historia es decision suya.
ramas:
  evidencia_force: true

# `subproyectos` es una LISTA y al heredar las listas REEMPLAZAN, asi que va copiada del blueprint
# con un solo cambio: el file-lock de Maven. Si el blueprint cambia lo demas, hay que sincronizar
# aqui — el precio de sobreescribir una lista.
#
# DONDE vive la cache ya NO se declara aqui: es `cache_ambito` en la RAIZ del perfil, que este repo
# HEREDA del blueprint (`stack`). Estaba dentro de este bloque y se perdia justo por lo de arriba —
# copiar la lista se llevaba el ambito por delante, en silencio.
subproyectos:
  - cwd: .
    build:
      instalar: [fdi-instalar-maven, -s, /run/fdi/credenciales/settings.xml,
                 -Dmaven.repo.local=.fdi/m2,
                 -Daether.syncContext.named.factory=file-lock,
         # El nameMapper NO es opcional con file-lock: sin el, Maven aborta con
         # «FileLockNamedLockFactory lock factory requires FS friendly NameMapper»
         # (error INTERNO, no una compuerta roja). `file-gav` es el mapeo por artefacto.
         -Daether.syncContext.named.nameMapper=file-gav]
      # La RUTA de la cache, relativa al subproyecto. El sandbox monta ENCIMA de ella el
      # almacenamiento que `cache_ambito` decida, asi que el argv no cambia y Maven no se entera.
      # Sirve ademas para podarla del contexto: el verificador no se tropieza con 200 MB de
      # dependencias al explorar el repo.
      cache: [.fdi/m2]
      manifiestos: [pom.xml, "*/pom.xml"]
      timeout_s: 2400
      limpiar: []
